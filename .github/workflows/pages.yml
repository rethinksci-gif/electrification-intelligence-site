name: Publish research website
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r automation/requirements.txt
      - run: python -m unittest discover -s automation/tests -v
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: python3 automation/validate.py
      - name: Record exact build for live confirmation
        run: python3 automation/confirm.py prepare --root public
      - uses: actions/upload-artifact@v7
        with:
          name: publication-receipt
          path: automation/expected-receipt.json
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: public
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment

      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          name: publication-receipt
          path: automation
      - name: Confirm live receipt and every published page
        env:
          LIVE_BASE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python3 automation/confirm.py confirm --base "$LIVE_BASE"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: live-confirmation
          path: automation/confirmation.json
          if-no-files-found: ignore
